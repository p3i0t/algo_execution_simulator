[project]
name = "algo-execution-simulator"
license = { text = "MIT" }
authors = [{ name = "algo_execution_simulator contributors" }]
keywords = ["execution", "vwap", "trading", "simulation", "market-microstructure"]
classifiers = [
        "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
]
version = "0.1.0"
description = "Market-agnostic execution simulator for VWAP-style algorithms (uniform, static volume-curve, institutional re-sync/pacing, signal-tilted scheduling)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "polars"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["execsim"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "ANN"]
